services:
  # hot-reloading dev server: docker compose up dev
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # production build behind nginx: docker compose up preview --build
  preview:
    build: .
    ports:
      - "8080:80"

volumes:
  node_modules:
